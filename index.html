<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshers Party 2K26</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #18002e, #5b087d, #e52e71);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 650px;
    width: 100%;
    padding: 45px 25px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    background: rgba(255,255,255,0.12);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.emoji {
    font-size: 45px;
    margin-bottom: 15px;
}

h2 {
    font-size: 20px;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    color: #ffe082;
    margin-bottom: 15px;
}

p {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 15px;
}

.date {
    font-size: 21px;
    font-weight: bold;
    color: #ffe082;
    margin: 25px 0;
}

.button {
    display: inline-block;
    background: #ffe082;
    color: #321044;
    padding: 15px 30px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 15px;
}

.footer {
    margin-top: 30px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="emoji">🎉 ✨ 🎊</div>

    <h2>USHA COLLEGE OF NURSING AND PHARMACY</h2>

    <h1>FRESHER'S PARTY 2K26</h1>

    <p>
        A new beginning, new friendships
        and unforgettable memories!
    </p>

    <div class="date">
        📅 20 November 2026
    </div>

    <p>
        📍 Venue: Usha College of Nursing and Pharmacy
    </p>

    <p>
        Get ready to celebrate your new journey!
    </p>

    <a href="register.html" class="button">
        REGISTER NOW
    </a>

    <div class="footer">
        Made with ❤️ for Fresher's Party 2K26
    </div>

</div>

</body>
</html>
